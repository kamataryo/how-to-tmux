<!doctype html>
<!-- OGP 画像の元。1200×630 で vm/render-images.sh が PNG にする。説明文やキャッチコピーは載せない -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OGP</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: grid;
        width: 1200px;
        height: 630px;
        padding: 44px 56px;
        overflow: hidden;
        background: #1a1c22;
        font-family: Menlo, Consolas, monospace;
      }
      .window {
        display: grid;
        grid-template-rows: 52px 1fr;
        overflow: hidden;
        border: 1px solid #4a4a4f;
        border-radius: 16px;
        background: #000;
        box-shadow: 0 18px 50px #000a;
      }
      .titlebar {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 0 20px;
        background: #2c2c2e;
      }
      .titlebar i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
      }
      .tmux {
        display: grid;
        grid-template: 1fr 1fr 44px / 7fr 3fr;
        min-height: 0;
      }
      .pane {
        padding: 18px 22px;
        color: #8a8a8f;
        font-size: 24px;
      }
      .pane + .pane {
        border-left: 2px solid #4a4a4f;
      }
      .pane.bottom {
        border-top: 2px solid #4a4a4f;
      }
      /* 実際のレッスンでハイライトに使う色で、アクティブなペインを囲む */
      .active {
        grid-row: span 2;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: 3px solid #fc0;
        outline-offset: -3px;
      }
      h1 {
        color: #f2f2f2;
        font-size: 100px;
        font-weight: 700;
        letter-spacing: -0.03em;
        word-spacing: -0.25em; /* 等幅フォントの空白は広すぎる */
        white-space: nowrap;
      }
      h1 em {
        color: #fc0;
        font-style: normal;
      }
      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 0.95em;
        margin-left: 0.12em;
        vertical-align: -0.12em;
        background: #f2f2f2;
      }
      .status {
        grid-column: span 2;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #4e9a06;
        color: #000;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <i style="background: #ff5f57"></i>
        <i style="background: #febc2e"></i>
        <i style="background: #28c840"></i>
      </div>
      <div class="tmux">
        <div class="pane active">
          <h1>How to <em>tmux</em><span class="cursor"></span></h1>
        </div>
        <div class="pane">localhost:~#</div>
        <div class="pane bottom">localhost:~#</div>
        <div class="status">[lesson] 0:sh*</div>
      </div>
    </div>
  </body>
</html>
