<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12">
  <title>セッションは複数作れて、端末が表示するのはそのうちの 1 つ</title>
  <text x="220" y="20" fill="#8e8e93" font-size="11" text-anchor="middle">tmux の中にセッションをいくつも作れる</text>
  <rect x="40" y="34" width="150" height="118" rx="8" fill="none" stroke="#6aa5ff" stroke-width="2" />
  <text x="50" y="52" fill="#6aa5ff" font-size="11">セッション lesson</text>
  <rect x="62" y="62" width="116" height="70" rx="4" fill="#242426" stroke="#5a5a5e" stroke-width="1.5" opacity="0.6" />
  <rect x="52" y="72" width="116" height="70" rx="4" fill="#2a2a2c" stroke="#5a5a5e" stroke-width="1.5" />
  <text x="110" y="111" fill="#8e8e93" font-size="10" text-anchor="middle">ウィンドウ</text>
  <rect x="250" y="34" width="150" height="118" rx="8" fill="none" stroke="#6aa5ff" stroke-width="2" />
  <text x="260" y="52" fill="#6aa5ff" font-size="11">セッション work</text>
  <rect x="272" y="62" width="116" height="70" rx="4" fill="#242426" stroke="#5a5a5e" stroke-width="1.5" opacity="0.6" />
  <rect x="262" y="72" width="116" height="70" rx="4" fill="#2a2a2c" stroke="#5a5a5e" stroke-width="1.5" />
  <text x="320" y="111" fill="#8e8e93" font-size="10" text-anchor="middle">ウィンドウ</text>
  <path d="M115 152v18" stroke="#ffcc00" stroke-width="2" />
  <rect x="75" y="170" width="80" height="22" rx="5" fill="#2a2a2c" stroke="#ffcc00" stroke-width="1.5" />
  <text x="115" y="185" fill="#ffcc00" font-size="11" text-anchor="middle">端末</text>
  <text x="170" y="185" fill="#8e8e93" font-size="11">表示しているのは、どれか 1 つ</text>
  <path d="M196 93h48m-7-5l7 5-7 5M244 93h-48m7-5l-7 5 7 5" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="220" y="80" fill="#8e8e93" font-size="10" text-anchor="middle">切り替え</text>
