<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12">
  <title>デタッチすると端末との接続だけが切れ、セッションは tmux サーバーの中で動き続ける</title>
  <rect x="12" y="46" width="120" height="96" rx="8" fill="#2a2a2c" stroke="#5a5a5e" stroke-width="1.5" />
  <text x="72" y="36" fill="#d8d8d8" font-weight="600" text-anchor="middle">端末</text>
  <text x="72" y="90" fill="#8e8e93" font-size="11" text-anchor="middle">画面とキーボード</text>
  <text x="72" y="106" fill="#8e8e93" font-size="11" text-anchor="middle">（SSH の手前側）</text>
  <rect x="268" y="46" width="160" height="96" rx="8" fill="none" stroke="#6aa5ff" stroke-width="2" />
  <text x="348" y="36" fill="#d8d8d8" font-weight="600" text-anchor="middle">tmux サーバー</text>
  <text x="280" y="66" fill="#6aa5ff" font-size="11">セッション lesson</text>
  <rect x="280" y="76" width="136" height="54" rx="4" fill="#1c1c1e" stroke="#5a5a5e" stroke-width="1.5" />
  <text x="290" y="96" fill="#7bc96f" font-size="11" font-family="Menlo, Consolas, monospace">$ top</text>
  <text x="290" y="114" fill="#7bc96f" font-size="10">動き続ける</text>
  <path d="M132 82h46M222 82h46" stroke="#8e8e93" stroke-width="2" stroke-dasharray="5 4" />
  <path d="M190 72l20 20M210 72l-20 20" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round" />
  <text x="200" y="62" fill="#ffcc00" font-size="11" text-anchor="middle">デタッチ</text>
  <path d="M132 118h136m-8-6l8 6-8 6" fill="none" stroke="#7bc96f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="200" y="136" fill="#7bc96f" font-size="11" text-anchor="middle" font-family="Menlo, Consolas, monospace">tmux attach</text>
  <text x="220" y="172" fill="#8e8e93" font-size="11" text-anchor="middle">切れるのは接続だけ。SSH が切れたときも同じで、</text>
  <text x="220" y="188" fill="#8e8e93" font-size="11" text-anchor="middle">あとからつなぎ直せば、続きから作業できる。</text>
</svg>
