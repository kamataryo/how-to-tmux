<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="12">
  <title>ウィンドウはセッションの中に並び、ステータスバーに一覧が出る</title>
  <rect x="8" y="14" width="212" height="172" rx="8" fill="none" stroke="#5a5a5e" stroke-width="2" />
  <text x="18" y="32" fill="#5a5a5e" font-size="11">セッション lesson</text>
  <rect x="34" y="42" width="174" height="118" rx="5" fill="#242426" stroke="#7bc96f" stroke-width="2" opacity="0.55" />
  <text x="200" y="56" fill="#7bc96f" font-size="10" text-anchor="end" opacity="0.8">ウィンドウ 1</text>
  <rect x="20" y="60" width="174" height="116" rx="5" fill="#2a2a2c" stroke="#7bc96f" stroke-width="2" />
  <text x="28" y="76" fill="#7bc96f" font-size="11">ウィンドウ 0</text>
  <rect x="28" y="84" width="76" height="84" rx="3" fill="#1c1c1e" stroke="#5a5a5e" stroke-width="2" />
  <rect x="110" y="84" width="76" height="84" rx="3" fill="#1c1c1e" stroke="#5a5a5e" stroke-width="2" />
  <text x="66" y="130" fill="#5a5a5e" font-size="11" text-anchor="middle">ペイン</text>
  <text x="148" y="130" fill="#5a5a5e" font-size="11" text-anchor="middle">ペイン</text>
  <text x="240" y="40" fill="#d8d8d8" font-weight="600">ウィンドウ</text>
  <text x="240" y="58" fill="#8e8e93" font-size="11">1 つのセッションにいくつも作れて、</text>
  <text x="240" y="74" fill="#8e8e93" font-size="11">表示するのは 1 つだけ。</text>
  <text x="240" y="112" fill="#8e8e93" font-size="11">ステータスバーに並ぶ</text>
  <rect x="240" y="120" width="192" height="20" rx="3" fill="#4e9a06" />
  <text x="246" y="134" fill="#000" font-size="11" font-family="Menlo, Consolas, monospace">[lesson] 0:sh- 1:sh*</text>
  <path d="M374 144v12" stroke="#7bc96f" stroke-width="1.5" />
  <text x="432" y="170" fill="#7bc96f" font-size="11" text-anchor="end">* が今いるウィンドウ</text>
  <text x="432" y="186" fill="#8e8e93" font-size="11" text-anchor="end">- は 1 つ前にいたウィンドウ</text>
</svg>
