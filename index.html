<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      wasm-unsafe-eval: v86 が実行時に WebAssembly を生成する / worker-src blob: v86 の zstd 展開
      style-src unsafe-inline: xterm.js が style 要素を差し込む
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; worker-src blob:; base-uri 'none'; form-action 'none'"
    />
    <title>How to tmux</title>
    <link rel="icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="How to tmux" />
    <meta property="og:url" content="https://kamataryo.github.io/how-to-tmux/" />
    <meta property="og:image" content="https://kamataryo.github.io/how-to-tmux/ogp.png" />
    <meta property="og:image:alt" content="How to tmux" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./xterm/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        accent-color: #fc0;
      }
      body {
        margin: 0;
        background: #1a1c22;
        color: #d0d0d0;
        font: 15px/1.6 system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(max-content, 1fr) minmax(320px, 1fr);
        gap: 16px;
        place-items: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: 16px;
      }
      .window {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        max-width: 100%;
        overflow: hidden;
        border: 1px solid #4a4a4f;
        border-radius: 10px;
        background: #1e1e1e;
        box-shadow: 0 18px 50px #000a;
      }
      .window[hidden] {
        display: none;
      }
      #lesson.minimized {
        height: auto;
      }
      /* 幅を保つので、最小化しても隣のウィンドウが動かない。visibility なので隠れた中身にフォーカスも移らない */
      .window.minimized > :not(.titlebar) {
        flex: none;
        height: 0;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        visibility: hidden;
      }
      .titlebar {
        position: relative;
        display: flex;
        flex: none;
        gap: 10px; /* ボタンの中心の間隔を、押しやすさの目安の 24px にする */
        align-items: center;
        height: 32px;
        padding: 0 12px;
        background: #2c2c2e;
      }
      .titlebar button {
        z-index: 1;
        width: 14px;
        height: 14px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: transparent; /* アイコンの色。ふだんは見せず、タイトルバーにポインターが乗ると出す */
        cursor: pointer;
      }
      .titlebar button svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: currentColor;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        pointer-events: none;
      }
      /* 押すと元に戻るボタンは、戻す向きのアイコンに替える */
      .titlebar button[aria-pressed='true'] .off,
      .titlebar button[aria-pressed='false'] .on {
        display: none;
      }
      .titlebar:hover button,
      .titlebar button:focus-visible {
        color: #000b;
      }
      .titlebar button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .titlebar .close {
        background: #ff5f57;
      }
      .titlebar .minimize {
        background: #febc2e;
      }
      .titlebar .maximize {
        background: #28c840;
      }
      .titlebar button:disabled {
        background: #6a6a6f;
        color: transparent;
        cursor: default;
      }
      .title {
        position: absolute;
        inset: 0;
        margin: 0;
        color: #c8c8c8;
        font-size: 13px;
        font-weight: 600;
        line-height: 32px;
        text-align: center;
        pointer-events: none;
        user-select: none;
      }
      #lesson {
        grid-area: 1 / 2;
        width: min(100%, 480px);
        height: min(100dvh - 32px, 560px);
      }
      .window-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
        padding: 12px;
      }
      #terminal-window {
        grid-area: 1 / 1;
        background: #000;
      }
      #terminal {
        display: block;
        overflow: auto;
      }
      /* ページ全体をフルスクリーンにする。端末だけにすると、その外にある #lesson が描画されなくなる */
      :fullscreen #terminal-window {
        position: fixed;
        inset: 0;
        z-index: 1;
        border: 0;
        border-radius: 0;
      }
      :fullscreen #terminal {
        display: grid;
        flex: 1;
        place-content: center;
        min-height: 0;
        overflow: hidden;
      }
      :fullscreen #lesson {
        position: fixed;
        top: 50%;
        right: 16px;
        z-index: 2;
        translate: 0 -50%;
      }
      :fullscreen #lesson .titlebar {
        cursor: move;
        touch-action: none;
      }
      p {
        margin: 0;
      }
      select,
      progress {
        width: 100%;
      }
      select,
      button {
        font: inherit;
      }
      /* 欄の中の操作部品は macOS のダークモードの部品に寄せる。面は半透明の白、上端に細いハイライト、フォーカスは外側の輪 */
      #lesson :is(select, .button) {
        box-sizing: border-box;
        height: 28px;
        border: 0;
        border-radius: 7px;
        background: #ffffff1f;
        box-shadow:
          inset 0 0.5px 0 #ffffff33,
          0 0 0 0.5px #00000066,
          0 1px 1.5px #0000004d;
        color: #e6e6e6;
        font-size: 13px;
        line-height: 28px;
        cursor: default;
        transition: background 0.1s;
      }
      #lesson :is(select, .button):hover {
        background: #ffffff29;
      }
      #lesson :is(select, .button):active {
        background: #ffffff14;
      }
      #lesson :is(select, .button, summary):focus-visible {
        outline: 3px solid #ffcc0080;
        outline-offset: 1px;
      }
      #lesson .button[hidden] {
        display: none;
      }
      #lesson .button {
        display: inline-block;
        padding: 0 14px;
        text-decoration: none;
        white-space: nowrap;
      }
      /* 進むための主なボタンは、アクセントの色で塗る */
      #lesson .button.primary {
        background: linear-gradient(#ffd633, #f5c400);
        box-shadow:
          inset 0 0.5px 0 #ffffff80,
          0 0 0 0.5px #00000066,
          0 1px 1.5px #0000004d;
        color: #1a1a1a;
        font-weight: 600;
      }
      #lesson .button.primary:hover {
        background: linear-gradient(#ffdd55, #ffcc00);
      }
      #lesson .button.primary:active {
        background: linear-gradient(#e6b800, #d9ad00);
      }
      /* ポップアップボタン。矢印は右端のアクセント色の四角に描く（CSP で data: の画像を使えないので、SVG を重ねる） */
      .popup {
        position: relative;
        flex: none;
      }
      .popup select {
        padding: 0 32px 0 10px;
        appearance: none;
        text-overflow: ellipsis;
      }
      .popup svg {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(#ffd633, #f5c400);
        box-shadow: inset 0 0.5px 0 #ffffff80;
        fill: none;
        stroke: #1a1a1a;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      #progress {
        flex: none;
        height: 6px;
        overflow: hidden;
        border: 0;
        border-radius: 3px;
        background: #ffffff1f;
        appearance: none;
      }
      #progress::-webkit-progress-bar {
        background: none;
      }
      #progress::-webkit-progress-value {
        border-radius: 3px;
        background: #fc0;
        transition: width 0.3s;
      }
      #progress::-moz-progress-bar {
        border-radius: 3px;
        background: #fc0;
      }
      #goal,
      #note {
        color: #a0a0a0;
        font-size: 13px;
      }
      #note a {
        float: right;
        margin-left: 1em;
        color: inherit;
      }
      #note a:hover {
        color: #fc0;
      }
      /* 進行中のステップを下端に揃える。上へはみ出した行は薄くなって消える（スクロールすれば読める） */
      #steps {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        scrollbar-width: none;
        mask-image: linear-gradient(transparent, #000 min(32px, 20%));
      }
      #steps > :first-child {
        margin-top: auto;
      }
      #steps li {
        padding: 6px 0 6px 12px;
        border-left: 3px solid transparent;
        transition: color 0.5s, border-left-color 0.5s;
      }
      #steps li[aria-current] {
        border-left-color: #fc0;
      }
      #steps li.done {
        color: #a0a0a0;
        font-size: 13px;
      }
      #steps li.done p::before {
        content: '✓ ';
        color: #6c6;
      }
      details {
        margin-top: 4px;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
        color: #a0a0a0;
      }
      code,
      kbd {
        padding: 0 4px;
        border-radius: 3px;
        background: #2a2a2a;
        color: #ffd866;
        font: 0.95em Menlo, Consolas, monospace;
      }
      #status {
        color: #fc0;
      }
      #status:empty {
        display: none;
      }
      #actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        min-height: 32px; /* #next の高さ。#next が消えても手順の欄の高さが変わらないようにする */
      }
      #restart {
        margin-left: auto;
      }
      /* 端末は 100 桁で固定なので、欄を横に置けない幅では上に重ね、指示と端末が同時に見えるようにする */
      @media (max-width: 1220px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          align-content: center;
        }
        #lesson {
          grid-area: auto;
          width: 100%;
          height: 40dvh;
        }
        #terminal-window {
          grid-area: auto;
        }
      }
    </style>
    <script type="module" src="./lesson-player.js"></script>
  </head>
  <body>
    <!-- ウィンドウの枠のボタンのアイコン。14×14 のボタンいっぱいに描く -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="icon-close" viewBox="0 0 14 14"><path d="M4.4 4.4l5.2 5.2M9.6 4.4l-5.2 5.2" fill="none" /></symbol>
      <symbol id="icon-minimize" viewBox="0 0 14 14"><path d="M3.8 7h6.4" fill="none" /></symbol>
      <symbol id="icon-restore" viewBox="0 0 14 14"><path d="M3.8 7h6.4M7 3.8v6.4" fill="none" /></symbol>
      <symbol id="icon-expand" viewBox="0 0 14 14"><path d="M4 4h4.4L4 8.4zM10 10H5.6L10 5.6z" stroke="none" /></symbol>
      <symbol id="icon-shrink" viewBox="0 0 14 14"><path d="M6.5 6.5H2.6l3.9-3.9zM7.5 7.5h3.9l-3.9 3.9z" stroke="none" /></symbol>
    </svg>
    <main>
      <section id="lesson" class="window" aria-labelledby="course-title">
        <header class="titlebar">
          <button class="close" aria-label="レッスンの欄を閉じる" title="閉じる"><svg viewBox="0 0 14 14" aria-hidden="true"><use href="#icon-close" /></svg></button>
          <button class="minimize" aria-label="レッスンの欄を最小化" aria-pressed="false" title="最小化"><svg viewBox="0 0 14 14" aria-hidden="true"><use class="off" href="#icon-minimize" /><use class="on" href="#icon-restore" /></svg></button>
          <h1 id="course-title" class="title"></h1>
        </header>
        <div class="window-body">
          <div class="popup">
            <select id="lessons" aria-label="レッスン"></select>
            <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M6 7.2l3-3 3 3M6 10.8l3 3 3-3" /></svg>
          </div>
          <p id="goal"></p>
          <progress id="progress" aria-label="ステップの進み具合"></progress>
          <ol id="steps" aria-live="polite"></ol>
          <p id="status" role="status"></p>
          <p id="actions">
            <button id="next" class="button primary" hidden>次へ</button>
            <a id="next-lesson" class="button primary" hidden>次のレッスンへ</a>
            <button id="restart" class="button">このレッスンをやり直す</button>
          </p>
          <!-- ふだんは端末の less で開く（lesson-player.js）。できないときは新しいタブで開く。同じタブで開くと VM とレッスンの状態が消える -->
          <p id="note"><kbd>F6</kbd> で端末とこの欄を行き来できます。<a id="license" href="./LICENSE.txt" target="_blank">GPL-3.0-or-later</a><a href="https://github.com/kamataryo/how-to-tmux" target="_blank">ソース</a></p>
        </div>
      </section>
      <section id="terminal-window" class="window" aria-labelledby="terminal-title">
        <header class="titlebar">
          <button class="close" aria-label="端末を閉じる" title="閉じる"><svg viewBox="0 0 14 14" aria-hidden="true"><use href="#icon-close" /></svg></button>
          <button class="minimize" aria-label="端末を最小化" aria-pressed="false" title="最小化"><svg viewBox="0 0 14 14" aria-hidden="true"><use class="off" href="#icon-minimize" /><use class="on" href="#icon-restore" /></svg></button>
          <button class="maximize" aria-label="端末をフルスクリーンにする" aria-pressed="false" title="フルスクリーン"><svg viewBox="0 0 14 14" aria-hidden="true"><use class="off" href="#icon-expand" /><use class="on" href="#icon-shrink" /></svg></button>
          <h2 id="terminal-title" class="title">端末</h2>
        </header>
        <!-- 端末の要素はコースが選ぶので、lesson-player.js がここに加える -->
      </section>
    </main>
  </body>
</html>
