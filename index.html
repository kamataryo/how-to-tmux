<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      wasm-unsafe-eval: v86 が実行時に WebAssembly を生成する / worker-src blob: v86 の zstd 展開
      style-src unsafe-inline: xterm.js が style 要素を差し込む
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; worker-src blob:; base-uri 'none'; form-action 'none'"
    />
    <title>How to tmux</title>
    <link rel="icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="How to tmux" />
    <meta property="og:url" content="https://kamataryo.github.io/how-to-tmux/" />
    <meta property="og:image" content="https://kamataryo.github.io/how-to-tmux/ogp.png" />
    <meta property="og:image:alt" content="How to tmux" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./xterm/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        accent-color: #fc0;
      }
      body {
        margin: 0;
        background: #1a1c22;
        color: #d0d0d0;
        font: 15px/1.6 system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(max-content, 1fr) minmax(320px, 1fr);
        gap: 16px;
        place-items: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: 16px;
      }
      .window {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        max-width: 100%;
        overflow: hidden;
        border: 1px solid #4a4a4f;
        border-radius: 10px;
        background: #1e1e1e;
        box-shadow: 0 18px 50px #000a;
      }
      .window[hidden] {
        display: none;
      }
      #lesson.minimized {
        height: auto;
      }
      /* 幅を保つので、最小化しても隣のウィンドウが動かない。visibility なので隠れた中身にフォーカスも移らない */
      .window.minimized > :not(.titlebar) {
        flex: none;
        height: 0;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        visibility: hidden;
      }
      .titlebar {
        position: relative;
        display: flex;
        flex: none;
        gap: 10px; /* ボタンの中心の間隔を、押しやすさの目安の 24px にする */
        align-items: center;
        height: 32px;
        padding: 0 12px;
        background: #2c2c2e;
      }
      .titlebar button {
        z-index: 1;
        width: 14px;
        height: 14px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        color: transparent;
        font: bold 11px/14px system-ui, sans-serif;
        cursor: pointer;
      }
      .titlebar:hover button,
      .titlebar button:focus-visible {
        color: #000a;
      }
      .titlebar button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .titlebar .close {
        background: #ff5f57;
      }
      .titlebar .minimize {
        background: #febc2e;
      }
      .titlebar .maximize {
        background: #28c840;
      }
      .titlebar button:disabled {
        background: #6a6a6f;
        color: transparent;
        cursor: default;
      }
      .title {
        position: absolute;
        inset: 0;
        margin: 0;
        color: #c8c8c8;
        font-size: 13px;
        font-weight: 600;
        line-height: 32px;
        text-align: center;
        pointer-events: none;
        user-select: none;
      }
      #lesson {
        grid-area: 1 / 2;
        width: min(100%, 480px);
        height: min(100dvh - 32px, 560px);
      }
      .window-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
        padding: 12px;
      }
      #terminal-window {
        grid-area: 1 / 1;
        background: #000;
      }
      #terminal {
        display: block;
        overflow: auto;
      }
      /* ページ全体をフルスクリーンにする。端末だけにすると、その外にある #lesson が描画されなくなる */
      :fullscreen #terminal-window {
        position: fixed;
        inset: 0;
        z-index: 1;
        border: 0;
        border-radius: 0;
      }
      :fullscreen #terminal {
        display: grid;
        flex: 1;
        place-content: center;
        min-height: 0;
        overflow: hidden;
      }
      :fullscreen #lesson {
        position: fixed;
        top: 50%;
        right: 16px;
        z-index: 2;
        translate: 0 -50%;
      }
      :fullscreen #lesson .titlebar {
        cursor: move;
        touch-action: none;
      }
      p {
        margin: 0;
      }
      select,
      progress {
        width: 100%;
      }
      select,
      button {
        font: inherit;
      }
      #goal,
      #note {
        color: #a0a0a0;
        font-size: 13px;
      }
      #note a {
        float: right;
        margin-left: 1em;
        color: inherit;
      }
      #note a:hover {
        color: #fc0;
      }
      /* 進行中のステップを下端に揃える。上へはみ出した行は薄くなって消える（スクロールすれば読める） */
      #steps {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        scrollbar-width: none;
        mask-image: linear-gradient(transparent, #000 min(32px, 20%));
      }
      #steps > :first-child {
        margin-top: auto;
      }
      #steps li {
        padding: 6px 0 6px 12px;
        border-left: 3px solid transparent;
        transition: color 0.5s, border-left-color 0.5s;
      }
      #steps li[aria-current] {
        border-left-color: #fc0;
      }
      #steps li.done {
        color: #a0a0a0;
        font-size: 13px;
      }
      #steps li.done p::before {
        content: '✓ ';
        color: #6c6;
      }
      details {
        margin-top: 4px;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
        color: #a0a0a0;
      }
      code,
      kbd {
        padding: 0 4px;
        border-radius: 3px;
        background: #2a2a2a;
        color: #ffd866;
        font: 0.95em Menlo, Consolas, monospace;
      }
      #status {
        color: #fc0;
      }
      #status:empty {
        display: none;
      }
      #actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        min-height: 32px; /* #next の高さ。#next が消えても手順の欄の高さが変わらないようにする */
      }
      #next {
        padding: 2px 16px;
        font-weight: bold;
      }
      #next-lesson {
        color: #fc0;
        font-weight: bold;
      }
      #restart {
        margin-left: auto;
        font-size: 13px;
      }
      /* 端末は 100 桁で固定なので、欄を横に置けない幅では上に重ね、指示と端末が同時に見えるようにする */
      @media (max-width: 1220px) {
        main {
          grid-template-columns: minmax(0, 1fr);
          align-content: center;
        }
        #lesson {
          grid-area: auto;
          width: 100%;
          height: 40dvh;
        }
        #terminal-window {
          grid-area: auto;
        }
      }
    </style>
    <script type="module" src="./lesson-player.js"></script>
  </head>
  <body>
    <main>
      <section id="lesson" class="window" aria-labelledby="course-title">
        <header class="titlebar">
          <button class="close" aria-label="レッスンの欄を閉じる" title="閉じる">×</button>
          <button class="minimize" aria-label="レッスンの欄を最小化" aria-pressed="false" title="最小化">−</button>
          <h1 id="course-title" class="title"></h1>
        </header>
        <div class="window-body">
          <select id="lessons" aria-label="レッスン"></select>
          <p id="goal"></p>
          <progress id="progress" aria-label="ステップの進み具合"></progress>
          <ol id="steps" aria-live="polite"></ol>
          <p id="status" role="status"></p>
          <p id="actions">
            <button id="next" hidden>次へ</button>
            <a id="next-lesson" hidden>次のレッスンへ</a>
            <button id="restart">このレッスンをやり直す</button>
          </p>
          <!-- ふだんは端末の less で開く（lesson-player.js）。できないときは新しいタブで開く。同じタブで開くと VM とレッスンの状態が消える -->
          <p id="note"><kbd>F6</kbd> で端末とこの欄を行き来できます。<a id="license" href="./LICENSE.txt" target="_blank">GPL-3.0-or-later</a><a href="https://github.com/kamataryo/how-to-tmux" target="_blank">ソース</a></p>
        </div>
      </section>
      <section id="terminal-window" class="window" aria-labelledby="terminal-title">
        <header class="titlebar">
          <button class="close" aria-label="端末を閉じる" title="閉じる">×</button>
          <button class="minimize" aria-label="端末を最小化" aria-pressed="false" title="最小化">−</button>
          <button class="maximize" aria-label="端末をフルスクリーンにする" aria-pressed="false" title="フルスクリーン">+</button>
          <h2 id="terminal-title" class="title">端末</h2>
        </header>
        <!-- 端末の要素はコースが選ぶので、lesson-player.js がここに加える -->
      </section>
    </main>
  </body>
</html>
